<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >  <title>ADEZ MINI BOT — WhatsApp Pair</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #183b32, #07110f 55%, #030706);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(10, 20, 18, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 15px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      background: linear-gradient(135deg, #25d366, #128c7e);
      box-shadow: 0 10px 30px rgba(37, 211, 102, 0.25);
    }

    h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin: 8px 0 22px;
      color: #a9b8b3;
      font-size: 14px;
    }

    .qr-box {
      width: 320px;
      max-width: 100%;
      min-height: 320px;
      margin: 0 auto 20px;
      padding: 12px;
      background: white;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-box img {
      width: 100%;
      max-width: 290px;
      display: block;
    }

    .loading {
      color: #222;
      font-size: 15px;
    }

    .status {
      min-height: 44px;
      padding: 12px 15px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      color: #c7d4cf;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .status.success {
      color: #25d366;
    }

    .status.error {
      color: #ff7676;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 14px;
      background: #25d366;
      color: #04120b;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .instructions {
      text-align: left;
      margin-top: 22px;
      padding: 16px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.045);
      color: #b9c6c1;
      font-size: 13px;
      line-height: 1.7;
    }

    .instructions strong {
      color: white;
    }

    .footer {
      margin-top: 20px;
      color: #667873;
      font-size: 11px;
    }
  </style></head><body>  <div class="card"><div class="logo">🤖</div>

<h1>ADEZ MINI BOT</h1>

<div class="subtitle">
  WhatsApp QR Pairing
</div>

<div class="qr-box" id="qrBox">
  <div class="loading">
    Generating QR code...
  </div>
</div>

<div class="status" id="status">
  Connecting to WhatsApp...
</div>

<button onclick="startPairing()">
  🔄 Generate New QR
</button>

<div class="instructions">
  <strong>How to link:</strong><br><br>

  1. Open WhatsApp on your phone.<br>
  2. Go to <strong>Settings → Linked Devices</strong>.<br>
  3. Tap <strong>Link a Device</strong>.<br>
  4. Scan the QR code shown above.<br>
  5. Wait for the page to show
  <strong>Linked Successfully</strong>.
</div>

<div class="footer">
  ADEZ TECH • ADEZ MINI BOT
</div>

  </div>  <script>
    let requestId = null;
    let polling = null;

    const qrBox = document.getElementById("qrBox");
    const statusBox = document.getElementById("status");

    function setStatus(message, type = "") {
      statusBox.className = "status " + type;
      statusBox.textContent = message;
    }

    async function startPairing() {
      if (polling) {
        clearInterval(polling);
        polling = null;
      }

      requestId = null;

      qrBox.innerHTML = `
        <div class="loading">
          Generating QR code...
        </div>
      `;

      setStatus("Connecting to WhatsApp...");

      try {
        const response = await fetch("/api/pair", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({})
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Failed to start pairing."
          );
        }

        requestId = data.requestId;

        pollStatus();

        polling = setInterval(
          pollStatus,
          1500
        );

      } catch (error) {
        console.error(error);

        qrBox.innerHTML = `
          <div class="loading">
            ❌
          </div>
        `;

        setStatus(
          error.message ||
          "Failed to start pairing.",
          "error"
        );
      }
    }

    async function pollStatus() {
      if (!requestId) return;

      try {
        const response = await fetch(
          "/api/pair/status/" + requestId,
          {
            cache: "no-store"
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Pairing request not found."
          );
        }

        // QR is ready
        if (
          data.status === "qr_ready" &&
          data.qr
        ) {
          qrBox.innerHTML = `
            <img
              src="${data.qr}"
              alt="WhatsApp QR Code"
            >
          `;

          setStatus(
            "📱 Scan this QR code with WhatsApp → Linked Devices."
          );
        }

        // Successfully linked
        if (data.status === "ready") {
          if (polling) {
            clearInterval(polling);
            polling = null;
          }

          qrBox.innerHTML = `
            <div style="
              color:#25d366;
              font-size:60px;
            ">
              ✓
            </div>
          `;

          setStatus(
            "✅ WhatsApp linked successfully! Your SESSION ID has been sent to your WhatsApp chat.",
            "success"
          );
        }

        // Error
        if (data.status === "error") {
          if (polling) {
            clearInterval(polling);
            polling = null;
          }

          qrBox.innerHTML = `
            <div class="loading">
              ❌
            </div>
          `;

          setStatus(
            data.error ||
            "Pairing failed. Generate a new QR code.",
            "error"
          );
        }

      } catch (error) {
        console.error(error);
      }
    }

    // Automatically start when page opens
    startPairing();
  </script></body>
</html>
